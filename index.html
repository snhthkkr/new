<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>atem</title>
<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#fff;position:fixed;touch-action:none}
#c{width:100%;height:100%;display:block}

/* Editor overlay */
#editor{
  position:fixed;display:none;z-index:100;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(320px,85vw);
  background:rgba(10,10,15,0.95);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:16px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
#editor.open{display:block}
#editor textarea{
  width:100%;min-height:80px;max-height:200px;
  background:transparent;border:none;outline:none;
  color:#fff;font-size:16px;line-height:1.5;
  font-family:inherit;resize:none;
  -webkit-user-select:text;user-select:text;
}
#editor textarea::placeholder{color:rgba(255,255,255,0.25)}
#editor-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}
#editor-actions button{
  background:rgba(255,255,255,0.08);border:none;
  color:rgba(255,255,255,0.7);font-size:13px;
  padding:6px 14px;border-radius:8px;cursor:pointer;
  font-family:inherit;
}
#editor-actions button:active{background:rgba(255,255,255,0.15)}
#editor-actions .save{color:#fff;background:rgba(255,255,255,0.15)}
#del-btn{color:rgba(255,100,100,0.8)}

/* Stats */
#stats{
  position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(255,255,255,0.2);
  letter-spacing:0.05em;pointer-events:none;
  white-space:nowrap;
}

/* Menu pill */
#menu-pill{
  position:fixed;top:max(16px,env(safe-area-inset-top,0px));right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:90;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#menu-pill:active{background:rgba(255,255,255,0.12)}
#menu-pill svg{width:16px;height:16px;opacity:0.4}

/* Menu dropdown */
#menu{
  position:fixed;top:max(60px,calc(env(safe-area-inset-top,0px)+52px));right:16px;
  background:rgba(10,10,15,0.95);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:6px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  z-index:91;display:none;min-width:160px;
}
#menu.open{display:block}
#menu button{
  display:block;width:100%;text-align:left;
  background:none;border:none;color:rgba(255,255,255,0.7);
  font-size:14px;padding:10px 12px;border-radius:8px;
  cursor:pointer;font-family:inherit;
}
#menu button:active{background:rgba(255,255,255,0.08)}

/* Hint */
#hint{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.08);
  font-size:14px;pointer-events:none;
  transition:opacity 0.8s ease;
}

/* Toast */
#toast{
  position:fixed;top:max(16px,env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%) translateY(-40px);
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:8px 16px;
  color:rgba(255,255,255,0.7);font-size:13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:all 0.3s ease;z-index:200;
  pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hint">tap anywhere</div>

<div id="editor">
  <textarea id="ed-text" placeholder="think..." autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
  <div id="editor-actions">
    <button id="del-btn">delete</button>
    <button id="cancel-btn">cancel</button>
    <button class="save" id="save-btn">done</button>
  </div>
</div>

<div id="stats"></div>

<div id="menu-pill" aria-label="menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
</div>

<div id="menu">
  <button id="btn-reset-view">reset view</button>
  <button id="btn-export">export thoughts</button>
  <button id="btn-import">import thoughts</button>
  <button id="btn-clear">clear all</button>
</div>

<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════

let state = { thoughts: [], connections: [], camera: null };
let editingId = null;
let connectSource = null;
let holdTimer = null;
let isDragging = false;
let draggedMesh = null;
let dragOffset = new THREE.Vector3();
let pointerStart = { x: 0, y: 0 };
let pointerMoved = false;
let holdTriggered = false;
let pendingLineMesh = null;
let menuOpen = false;
let hintVisible = true;

const HOLD_MS = 350;
const DRAG_THRESH = 8;
const SPHERE_RADIUS = 0.35;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const intersectPt = new THREE.Vector3();

// ═══════════════════════════════════════════
// Scene setup
// ═══════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.035);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.panSpeed = 0.8;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.enableRotate = true;

// Lighting
const ambient = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 8, 10);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x4466aa, 0.3);
backLight.position.set(-5, -3, -8);
scene.add(backLight);

// Subtle star field
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 400; i++) {
  starVerts.push((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.3 });
scene.add(new THREE.Points(starGeo, starMat));

// Groups
const thoughtGroup = new THREE.Group();
scene.add(thoughtGroup);
const lineGroup = new THREE.Group();
scene.add(lineGroup);

// ═══════════════════════════════════════════
// Thought mesh creation
// ═══════════════════════════════════════════

const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 24, 18);

function makeThoughtMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color || '#6ea8fe'),
    emissive: new THREE.Color(color || '#6ea8fe'),
    emissiveIntensity: 0.15,
    roughness: 0.4,
    metalness: 0.1,
    transparent: true,
    opacity: 0.9,
  });
}

function createLabel(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 512, 128);
  ctx.fillStyle = '#ffffff';
  ctx.font = '500 28px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Truncate if needed
  let display = text || '';
  if (display.length > 40) display = display.slice(0, 38) + '…';
  
  // Word wrap simple
  const words = display.split(' ');
  let lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > 460) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  if (lines.length > 3) lines = lines.slice(0, 3);
  
  const lineH = 32;
  const startY = 64 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((l, i) => ctx.fillText(l, 256, startY + i * lineH));
  
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3, 0.75, 1);
  sprite.position.y = -SPHERE_RADIUS - 0.5;
  return sprite;
}

function addThoughtMesh(t) {
  const mat = makeThoughtMaterial(t.color);
  const mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.position.set(t.position[0], t.position[1], t.position[2]);
  mesh.userData = { id: t.id, baseEmissive: 0.15, targetEmissive: 0.15, breath: Math.random() * Math.PI * 2 };
  
  // Label
  if (t.text) {
    const label = createLabel(t.text);
    label.name = 'label';
    mesh.add(label);
  }
  
  thoughtGroup.add(mesh);
  return mesh;
}

function updateLabel(mesh, text) {
  const old = mesh.getObjectByName('label');
  if (old) mesh.remove(old);
  if (text) {
    const label = createLabel(text);
    label.name = 'label';
    mesh.add(label);
  }
}

function getMesh(id) {
  return thoughtGroup.children.find(m => m.userData.id === id);
}

// ═══════════════════════════════════════════
// Connection rendering
// ═══════════════════════════════════════════

function rebuildConnections() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  
  // Group connections between same pair
  const pairs = {};
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    pairs[key] = (pairs[key] || 0) + 1;
  }
  
  const drawn = new Set();
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    if (drawn.has(key)) continue;
    drawn.add(key);
    
    const mA = getMesh(c.from);
    const mB = getMesh(c.to);
    if (!mA || !mB) continue;
    
    const density = pairs[key] || 1;
    const thick = Math.min(0.02 + density * 0.015, 0.08);
    const opacity = Math.min(0.2 + density * 0.1, 0.7);
    
    const points = [mA.position.clone(), mB.position.clone()];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ 
      color: 0x6ea8fe, transparent: true, opacity,
      linewidth: 1 // WebGL limitation, but we set it anyway
    });
    const line = new THREE.Line(geo, mat);
    line.userData = { from: c.from, to: c.to, density };
    lineGroup.add(line);
  }
}

function updateConnectionPositions() {
  for (const line of lineGroup.children) {
    const mA = getMesh(line.userData.from);
    const mB = getMesh(line.userData.to);
    if (!mA || !mB) continue;
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, mA.position.x, mA.position.y, mA.position.z);
    pos.setXYZ(1, mB.position.x, mB.position.y, mB.position.z);
    pos.needsUpdate = true;
  }
}

// Pending connection line
function createPendingLine() {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
  const line = new THREE.Line(geo, mat);
  line.visible = false;
  scene.add(line);
  return line;
}
pendingLineMesh = createPendingLine();

// ═══════════════════════════════════════════
// Persistence
// ═══════════════════════════════════════════

function save() {
  state.camera = {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z
  };
  try { localStorage.setItem('atem-state', JSON.stringify(state)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem('atem-state');
    if (!raw) return;
    const s = JSON.parse(raw);
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    if (s.camera) {
      camera.position.set(s.camera.px, s.camera.py, s.camera.pz);
      controls.target.set(s.camera.tx, s.camera.ty, s.camera.tz);
    }
    // Rebuild meshes
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildConnections();
    if (state.thoughts.length > 0) hideHint();
  } catch(e) { console.warn('load failed', e); }
}

// ═══════════════════════════════════════════
// Thought CRUD
// ═══════════════════════════════════════════

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const COLORS = ['#6ea8fe','#a78bfa','#f472b6','#34d399','#fbbf24','#fb923c','#f87171','#67e8f9'];
let colorIdx = 0;

function createThought(x, y, z) {
  const t = {
    id: uid(),
    text: '',
    position: [x, y, z],
    color: COLORS[colorIdx++ % COLORS.length],
    created: Date.now(),
    touched: Date.now()
  };
  state.thoughts.push(t);
  const mesh = addThoughtMesh(t);
  save();
  hideHint();
  return t;
}

function updateThought(id, text) {
  const t = state.thoughts.find(t => t.id === id);
  if (!t) return;
  t.text = text;
  t.touched = Date.now();
  const mesh = getMesh(id);
  if (mesh) updateLabel(mesh, text);
  save();
}

function deleteThought(id) {
  state.thoughts = state.thoughts.filter(t => t.id !== id);
  state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
  const mesh = getMesh(id);
  if (mesh) thoughtGroup.remove(mesh);
  rebuildConnections();
  save();
}

function moveThought(id, x, y, z) {
  const t = state.thoughts.find(t => t.id === id);
  if (!t) return;
  t.position = [x, y, z];
  t.touched = Date.now();
}

function addConnection(fromId, toId) {
  if (fromId === toId) return;
  state.connections.push({ id: uid(), from: fromId, to: toId, created: Date.now() });
  rebuildConnections();
  save();
  toast('connected');
}

// ═══════════════════════════════════════════
// Editor
// ═══════════════════════════════════════════

const editorEl = document.getElementById('editor');
const edText = document.getElementById('ed-text');
const saveBtn = document.getElementById('save-btn');
const cancelBtn = document.getElementById('cancel-btn');
const delBtn = document.getElementById('del-btn');

function openEditor(id) {
  editingId = id;
  const t = state.thoughts.find(t => t.id === id);
  edText.value = t ? t.text : '';
  editorEl.classList.add('open');
  controls.enabled = false;
  // Auto-size
  edText.style.height = 'auto';
  setTimeout(() => {
    edText.focus();
    edText.selectionStart = edText.value.length;
  }, 50);
}

function closeEditor(doSave) {
  if (doSave && editingId) {
    const text = edText.value.trim();
    if (!text) {
      deleteThought(editingId);
    } else {
      updateThought(editingId, text);
    }
  }
  editingId = null;
  editorEl.classList.remove('open');
  controls.enabled = true;
}

saveBtn.addEventListener('click', () => closeEditor(true));
cancelBtn.addEventListener('click', () => {
  // If new thought with no text, delete it
  if (editingId) {
    const t = state.thoughts.find(t => t.id === editingId);
    if (t && !t.text) deleteThought(editingId);
  }
  closeEditor(false);
});
delBtn.addEventListener('click', () => {
  if (editingId) deleteThought(editingId);
  closeEditor(false);
});

// Keyboard in editor
edText.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
  // Desktop: Enter without shift = save
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
    closeEditor(true);
    e.preventDefault();
  }
});

// Auto-resize textarea
edText.addEventListener('input', () => {
  edText.style.height = 'auto';
  edText.style.height = Math.min(edText.scrollHeight, 200) + 'px';
});

// ═══════════════════════════════════════════
// Raycast helpers
// ═══════════════════════════════════════════

function ndcFromEvent(e) {
  const x = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const y = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
  pointer.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
}

function hitThought(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(thoughtGroup.children, false);
  return hits.length ? hits[0].object : null;
}

function worldPosFromScreen(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  // Project onto a plane facing the camera at z=0 relative to camera target
  const camDir = camera.getWorldDirection(new THREE.Vector3());
  plane.setFromNormalAndCoplanarPoint(camDir.negate(), controls.target);
  raycaster.ray.intersectPlane(plane, intersectPt);
  return intersectPt.clone();
}

// ═══════════════════════════════════════════
// Touch / Mouse interaction
// ═══════════════════════════════════════════

function pxFromEvent(e) {
  return {
    x: e.clientX ?? e.touches?.[0]?.clientX ?? 0,
    y: e.clientY ?? e.touches?.[0]?.clientY ?? 0
  };
}

function onPointerDown(e) {
  if (editorEl.classList.contains('open')) return;
  if (e.target !== canvas) return;
  // Ignore multi-touch (pinch/pan)
  if (e.touches && e.touches.length > 1) { clearHold(); return; }
  
  const px = pxFromEvent(e);
  pointerStart = px;
  pointerMoved = false;
  holdTriggered = false;
  isDragging = false;
  
  const hit = hitThought(e);
  
  if (hit) {
    // Start potential drag or hold
    draggedMesh = hit;
    
    // Calculate offset for smooth dragging
    const wp = worldPosFromScreen(e);
    dragOffset.copy(draggedMesh.position).sub(wp);
    
    // Start hold timer for connect mode
    holdTimer = setTimeout(() => {
      if (!pointerMoved) {
        holdTriggered = true;
        connectSource = draggedMesh.userData.id;
        draggedMesh.material.emissiveIntensity = 0.6;
        pendingLineMesh.visible = true;
        // Haptic feedback if available
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }, HOLD_MS);
    
    controls.enabled = false;
  } else {
    // Clicking empty space — let orbit controls handle, but track for tap-to-create
    draggedMesh = null;
    controls.enabled = true;
  }
}

function onPointerMove(e) {
  if (editorEl.classList.contains('open')) return;
  if (e.touches && e.touches.length > 1) { clearHold(); return; }
  
  const px = pxFromEvent(e);
  const dx = px.x - pointerStart.x;
  const dy = px.y - pointerStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  if (dist > DRAG_THRESH) pointerMoved = true;
  
  if (draggedMesh && !holdTriggered && pointerMoved) {
    // Dragging a thought
    clearTimeout(holdTimer);
    isDragging = true;
    const wp = worldPosFromScreen(e);
    draggedMesh.position.copy(wp.add(dragOffset));
    moveThought(draggedMesh.userData.id, draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
    updateConnectionPositions();
  }
  
  if (holdTriggered && connectSource) {
    // Drawing connection line
    const srcMesh = getMesh(connectSource);
    if (srcMesh) {
      const wp = worldPosFromScreen(e);
      const pos = pendingLineMesh.geometry.attributes.position;
      pos.setXYZ(0, srcMesh.position.x, srcMesh.position.y, srcMesh.position.z);
      pos.setXYZ(1, wp.x, wp.y, wp.z);
      pos.needsUpdate = true;
    }
    
    // Highlight hovered thought
    const hit = hitThought(e);
    for (const child of thoughtGroup.children) {
      child.userData.targetEmissive = (hit === child && child.userData.id !== connectSource) ? 0.5 : 0.15;
    }
  }
}

function onPointerUp(e) {
  if (editorEl.classList.contains('open')) return;
  
  clearTimeout(holdTimer);
  
  if (holdTriggered && connectSource) {
    // Finish connection
    pendingLineMesh.visible = false;
    const hit = hitThought(e);
    if (hit && hit.userData.id !== connectSource) {
      addConnection(connectSource, hit.userData.id);
    }
    // Reset emissive
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    for (const child of thoughtGroup.children) child.userData.targetEmissive = 0.15;
    connectSource = null;
  } else if (isDragging && draggedMesh) {
    // Finished drag
    save();
  } else if (draggedMesh && !pointerMoved) {
    // Tap on thought = edit
    openEditor(draggedMesh.userData.id);
  } else if (!draggedMesh && !pointerMoved) {
    // Tap on empty space = create
    const wp = worldPosFromScreen(e);
    const t = createThought(wp.x, wp.y, wp.z);
    openEditor(t.id);
  }
  
  draggedMesh = null;
  isDragging = false;
  holdTriggered = false;
  controls.enabled = true;
}

function clearHold() {
  clearTimeout(holdTimer);
  holdTriggered = false;
  if (connectSource) {
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    connectSource = null;
    pendingLineMesh.visible = false;
  }
}

// Touch events
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend', onPointerUp);
canvas.addEventListener('touchcancel', () => { clearHold(); draggedMesh = null; isDragging = false; controls.enabled = true; });

// Mouse events
canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// ═══════════════════════════════════════════
// Menu
// ═══════════════════════════════════════════

const menuEl = document.getElementById('menu');
const menuPill = document.getElementById('menu-pill');

menuPill.addEventListener('click', (e) => {
  e.stopPropagation();
  menuOpen = !menuOpen;
  menuEl.classList.toggle('open', menuOpen);
});

document.addEventListener('click', (e) => {
  if (menuOpen && !menuEl.contains(e.target) && e.target !== menuPill) {
    menuOpen = false;
    menuEl.classList.remove('open');
  }
});

document.getElementById('btn-reset-view').addEventListener('click', () => {
  camera.position.set(0, 0, 18);
  controls.target.set(0, 0, 0);
  menuOpen = false; menuEl.classList.remove('open');
  save();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const data = JSON.stringify({ thoughts: state.thoughts, connections: state.connections }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `atem-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  menuOpen = false; menuEl.classList.remove('open');
  toast('exported');
});

document.getElementById('btn-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.thoughts) {
          // Clear existing
          while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
          while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
          state.thoughts = data.thoughts;
          state.connections = data.connections || [];
          for (const t of state.thoughts) addThoughtMesh(t);
          rebuildConnections();
          save();
          toast('imported ' + state.thoughts.length + ' thoughts');
          if (state.thoughts.length > 0) hideHint();
        }
      } catch(err) { toast('import failed'); }
    };
    reader.readAsText(file);
  };
  input.click();
  menuOpen = false; menuEl.classList.remove('open');
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('clear all thoughts?')) return;
  state.thoughts = [];
  state.connections = [];
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  save();
  menuOpen = false; menuEl.classList.remove('open');
  toast('cleared');
});

// ═══════════════════════════════════════════
// Toast & Hint
// ═══════════════════════════════════════════

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function hideHint() {
  if (!hintVisible) return;
  hintVisible = false;
  const h = document.getElementById('hint');
  h.style.opacity = '0';
  setTimeout(() => h.style.display = 'none', 800);
}

// ═══════════════════════════════════════════
// Stats
// ═══════════════════════════════════════════

function updateStats() {
  const el = document.getElementById('stats');
  const tc = state.thoughts.length;
  const cc = state.connections.length;
  if (tc === 0) { el.textContent = ''; return; }
  el.textContent = `${tc} thought${tc !== 1 ? 's' : ''}${cc > 0 ? ` · ${cc} connection${cc !== 1 ? 's' : ''}` : ''}`;
}

// ═══════════════════════════════════════════
// Animation
// ═══════════════════════════════════════════

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  controls.update();
  
  // Breathing animation + emissive lerp
  for (const mesh of thoughtGroup.children) {
    const ud = mesh.userData;
    ud.breath += dt * 0.8;
    
    // Gentle float
    if (!isDragging || mesh !== draggedMesh) {
      mesh.position.y += Math.sin(ud.breath) * 0.0003;
      mesh.position.x += Math.cos(ud.breath * 0.7) * 0.0002;
    }
    
    // Emissive lerp
    const current = mesh.material.emissiveIntensity;
    const target = ud.targetEmissive + Math.sin(ud.breath) * 0.03;
    mesh.material.emissiveIntensity += (target - current) * 0.1;
  }
  
  // Update connection positions (for breathing movement)
  if (lineGroup.children.length > 0) updateConnectionPositions();
  
  updateStats();
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════
// Resize
// ═══════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════

load();
animate();

// Auto-save periodically
setInterval(save, 10000);

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

console.log('atem — alive');
</script>
