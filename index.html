<!DOCTYPE html>
<html lang="en">
<head>

<title>atem</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#fff;position:fixed;touch-action:none}
#c{width:100%;height:100%;display:block}

/* ─── Editor overlay (tap-to-edit) ─── */
#editor{
  position:fixed;display:none;z-index:100;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(320px,85vw);
  background:rgba(10,10,15,0.95);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
#editor.open{display:block}
#editor textarea{
  width:100%;min-height:80px;max-height:200px;
  background:transparent;border:none;outline:none;
  color:#fff;font-size:16px;line-height:1.5;
  font-family:inherit;resize:none;
  -webkit-user-select:text;user-select:text;
}
#editor textarea::placeholder{color:rgba(255,255,255,0.25)}

/* folder picker inside editor */
#ed-folder-row{
  display:flex;align-items:center;gap:6px;
  margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
  flex-wrap:wrap;
}
#ed-folder-row .folder-chip{
  padding:4px 10px;border-radius:20px;font-size:12px;
  background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);
  border:1px solid rgba(255,255,255,0.08);cursor:pointer;
  white-space:nowrap;
}
#ed-folder-row .folder-chip.active{
  background:rgba(110,168,254,0.2);color:rgba(110,168,254,0.9);
  border-color:rgba(110,168,254,0.3);
}
#ed-folder-row .folder-chip.add-new{
  color:rgba(255,255,255,0.3);border-style:dashed;
}
#ed-folder-input{
  background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.2);
  color:#fff;font-size:12px;padding:4px 2px;outline:none;width:80px;
  font-family:inherit;display:none;
  -webkit-user-select:text;user-select:text;
}

#editor-actions{
  display:flex;justify-content:flex-end;gap:8px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}
#editor-actions button{
  background:rgba(255,255,255,0.08);border:none;
  color:rgba(255,255,255,0.7);font-size:13px;
  padding:6px 14px;border-radius:8px;cursor:pointer;
  font-family:inherit;
}
#editor-actions button:active{background:rgba(255,255,255,0.15)}
#editor-actions .save{color:#fff;background:rgba(255,255,255,0.15)}
#del-btn{color:rgba(255,100,100,0.8)}

/* ─── Zero button (feature 1) ─── */
#zero-btn{
  position:fixed;
  bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px));
  left:50%;transform:translateX(-50%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:80;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background 0.2s;
}
#zero-btn:active{background:rgba(255,255,255,0.1)}
#zero-btn svg{width:18px;height:18px;opacity:0.3}
/* subtle pulse animation */
@keyframes zero-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(110,168,254,0)}
  50%{box-shadow:0 0 0 6px rgba(110,168,254,0.06)}
}
#zero-btn{animation:zero-pulse 4s ease-in-out infinite}

/* ─── Zero capture overlay (feature 1) ─── */
#zero-overlay{
  position:fixed;inset:0;z-index:150;display:none;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
#zero-overlay.open{display:flex}
#zero-overlay textarea{
  width:100%;max-width:480px;min-height:120px;max-height:50vh;
  background:transparent;border:none;outline:none;
  color:#fff;font-size:20px;line-height:1.6;
  font-family:inherit;resize:none;text-align:center;
  -webkit-user-select:text;user-select:text;
}
#zero-overlay textarea::placeholder{color:rgba(255,255,255,0.15)}
#zero-actions{
  display:flex;gap:12px;margin-top:24px;
}
#zero-actions button{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.7);font-size:14px;
  padding:8px 20px;border-radius:10px;cursor:pointer;
  font-family:inherit;
}
#zero-actions button:active{background:rgba(255,255,255,0.15)}
#zero-actions .save{color:#fff;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.15)}

/* ─── Folder filter bar (feature 2) ─── */
#folder-bar{
  position:fixed;
  top:max(14px,env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:85;
  max-width:calc(100vw - 100px);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:2px 4px;
}
#folder-bar::-webkit-scrollbar{display:none}
#folder-bar .ftab{
  padding:5px 12px;border-radius:20px;font-size:12px;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);
  border:1px solid rgba(255,255,255,0.06);cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all 0.2s;
}
#folder-bar .ftab:active{background:rgba(255,255,255,0.08)}
#folder-bar .ftab.active{
  background:rgba(110,168,254,0.15);color:rgba(110,168,254,0.9);
  border-color:rgba(110,168,254,0.25);
}

/* ─── Stats ─── */
#stats{
  position:fixed;bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 60px));
  left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(255,255,255,0.15);
  letter-spacing:0.05em;pointer-events:none;white-space:nowrap;
}

/* ─── Menu pill ─── */
#menu-pill{
  position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:90;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#menu-pill:active{background:rgba(255,255,255,0.12)}
#menu-pill svg{width:16px;height:16px;opacity:0.4}

/* ─── Menu dropdown ─── */
#menu{
  position:fixed;top:max(56px,calc(env(safe-area-inset-top,0px)+48px));right:16px;
  background:rgba(10,10,15,0.95);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:6px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  z-index:91;display:none;min-width:180px;
}
#menu.open{display:block}
#menu button{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;text-align:left;
  background:none;border:none;color:rgba(255,255,255,0.7);
  font-size:14px;padding:10px 12px;border-radius:8px;
  cursor:pointer;font-family:inherit;
}
#menu button:active{background:rgba(255,255,255,0.08)}
/* toggle indicator */
.toggle-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.15);flex-shrink:0;
}
.toggle-dot.on{background:rgba(110,168,254,0.8)}

/* ─── Hint ─── */
#hint{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.08);
  font-size:14px;pointer-events:none;
  transition:opacity 0.8s ease;
}

/* ─── Toast ─── */
#toast{
  position:fixed;top:max(16px,env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%) translateY(-40px);
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:8px 16px;
  color:rgba(255,255,255,0.7);font-size:13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:all 0.3s ease;z-index:200;
  pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<canvas id="c"></canvas>

<div id="hint">tap anywhere</div>

<!-- Editor (tap-to-edit existing thought) -->
<div id="editor">
  <textarea id="ed-text" placeholder="think..." autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
  <div id="ed-folder-row">
    <!-- folder chips rendered dynamically -->
  </div>
  <div id="editor-actions">
    <button id="del-btn">delete</button>
    <button id="cancel-btn">cancel</button>
    <button class="save" id="save-btn">done</button>
  </div>
</div>

<!-- Zero button (feature 1) -->
<div id="zero-btn" aria-label="quick capture">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</div>

<!-- Zero capture overlay (feature 1) -->
<div id="zero-overlay">
  <textarea id="zero-text" placeholder="what's on your mind?" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
  <div id="zero-actions">
    <button id="zero-cancel">cancel</button>
    <button class="save" id="zero-save">done</button>
  </div>

<!-- Folder bar (feature 2) -->

<!-- Stats -->

<!-- Menu pill -->

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
</div>

<!-- Menu dropdown -->
<div id="menu">
  <button id="btn-reset-view">reset view</button>
  <button id="btn-export">export thoughts</button>
  <button id="btn-import">import thoughts</button>
  <button id="btn-open-capture">open to capture <span class="toggle-dot" id="capture-toggle-dot"></span></button>
  <button id="btn-clear">clear all</button>
</div>

<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════

let state = {
  thoughts: [],
  connections: [],
  folders: [],        // feature 2: array of folder name strings
  activeFolder: null, // feature 2: null = show all
  camera: null,
  openToCapture: false // feature 3
};

let editingId = null;
let editingFolder = null; // tracks folder assignment during edit
let connectSource = null;
let holdTimer = null;
let isDragging = false;
let draggedMesh = null;
let dragOffset = new THREE.Vector3();
let pointerStart = { x: 0, y: 0 };
let pointerMoved = false;
let holdTriggered = false;
let pendingLineMesh = null;
let menuOpen = false;
let hintVisible = true;

const HOLD_MS = 350;
const DRAG_THRESH = 8;
const SPHERE_RADIUS = 0.35;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const intersectPt = new THREE.Vector3();

// ═══════════════════════════════════════════
// Scene setup
// ═══════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.035);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.panSpeed = 0.8;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 60;
controls.enableRotate = true;

// Lighting
scene.add(new THREE.AmbientLight(0x404060, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 8, 10);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x4466aa, 0.3);
backLight.position.set(-5, -3, -8);
scene.add(backLight);

// Star field
const starGeo = new THREE.BufferGeometry();
const sv = [];
for (let i = 0; i < 400; i++) sv.push((Math.random()-0.5)*100,(Math.random()-0.5)*100,(Math.random()-0.5)*100);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.08, transparent:true, opacity:0.3 })));

// Groups
const thoughtGroup = new THREE.Group();
scene.add(thoughtGroup);
const lineGroup = new THREE.Group();
scene.add(lineGroup);

// ═══════════════════════════════════════════
// Thought mesh creation
// ═══════════════════════════════════════════

const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 24, 18);

function makeThoughtMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color || '#6ea8fe'),
    emissive: new THREE.Color(color || '#6ea8fe'),
    emissiveIntensity: 0.15,
    roughness: 0.4, metalness: 0.1,
    transparent: true, opacity: 0.9,
  });
}

function createLabel(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 512, 128);
  ctx.fillStyle = '#ffffff';
  ctx.font = '500 28px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let display = text || '';
  if (display.length > 40) display = display.slice(0, 38) + '…';
  const words = display.split(' ');
  let lines = [], line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > 460) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  if (lines.length > 3) lines = lines.slice(0, 3);
  const lineH = 32;
  const startY = 64 - ((lines.length - 1) * lineH) / 2;
  lines.forEach((l, i) => ctx.fillText(l, 256, startY + i * lineH));
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(3, 0.75, 1);
  sprite.position.y = -SPHERE_RADIUS - 0.5;
  return sprite;
}

function addThoughtMesh(t) {
  const mat = makeThoughtMaterial(t.color);
  const mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.position.set(t.position[0], t.position[1], t.position[2]);
  mesh.userData = { id: t.id, baseEmissive: 0.15, targetEmissive: 0.15, targetOpacity: 0.9, breath: Math.random() * Math.PI * 2 };
  if (t.text) { const label = createLabel(t.text); label.name = 'label'; mesh.add(label); }
  thoughtGroup.add(mesh);
  return mesh;
}

function updateLabel(mesh, text) {
  const old = mesh.getObjectByName('label');
  if (old) mesh.remove(old);
  if (text) { const label = createLabel(text); label.name = 'label'; mesh.add(label); }
}

function getMesh(id) {
  return thoughtGroup.children.find(m => m.userData.id === id);
}

// ═══════════════════════════════════════════
// Connection rendering
// ═══════════════════════════════════════════

function rebuildConnections() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  const pairs = {};
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    pairs[key] = (pairs[key] || 0) + 1;
  }
  const drawn = new Set();
  for (const c of state.connections) {
    const key = [c.from, c.to].sort().join('|');
    if (drawn.has(key)) continue;
    drawn.add(key);
    const mA = getMesh(c.from), mB = getMesh(c.to);
    if (!mA || !mB) continue;
    const density = pairs[key] || 1;
    const opacity = Math.min(0.2 + density * 0.1, 0.7);
    const geo = new THREE.BufferGeometry().setFromPoints([mA.position.clone(), mB.position.clone()]);
    const mat = new THREE.LineBasicMaterial({ color: 0x6ea8fe, transparent: true, opacity, linewidth: 1 });
    const line = new THREE.Line(geo, mat);
    line.userData = { from: c.from, to: c.to, density };
    lineGroup.add(line);
  }
}

function updateConnectionPositions() {
  for (const line of lineGroup.children) {
    const mA = getMesh(line.userData.from), mB = getMesh(line.userData.to);
    if (!mA || !mB) continue;
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, mA.position.x, mA.position.y, mA.position.z);
    pos.setXYZ(1, mB.position.x, mB.position.y, mB.position.z);
    pos.needsUpdate = true;
  }
}

// Pending connection line
function createPendingLine() {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
  const line = new THREE.Line(geo, mat);
  line.visible = false;
  scene.add(line);
  return line;
}
pendingLineMesh = createPendingLine();

// ═══════════════════════════════════════════
// Folder filtering (feature 2)
// ═══════════════════════════════════════════

function isThoughtVisible(t) {
  if (!state.activeFolder) return true; // 'all' view
  if (!t.folder) return true; // unassigned = always visible
  return t.folder === state.activeFolder;
}

function applyFolderFilter() {
  // Update thought visibility
  for (const mesh of thoughtGroup.children) {
    const t = state.thoughts.find(x => x.id === mesh.userData.id);
    if (!t) continue;
    const visible = isThoughtVisible(t);
    mesh.userData.targetOpacity = visible ? 0.9 : 0.04;
    mesh.userData.targetEmissive = visible ? 0.15 : 0.02;
    // Label visibility
    const label = mesh.getObjectByName('label');
    if (label) label.material.opacity = visible ? 0.85 : 0.03;
  }
  // Update connections
  for (const line of lineGroup.children) {
    const tA = state.thoughts.find(x => x.id === line.userData.from);
    const tB = state.thoughts.find(x => x.id === line.userData.to);
    if (!tA || !tB) { line.visible = false; continue; }
    line.visible = isThoughtVisible(tA) && isThoughtVisible(tB);
  }
  renderFolderBar();
}

function renderFolderBar() {
  const bar = document.getElementById('folder-bar');
  // Only show bar if folders exist
  if (state.folders.length === 0) { bar.innerHTML = ''; return; }
  
  let html = `<div class="ftab${!state.activeFolder ? ' active' : ''}" data-folder="__all__">all</div>`;
  for (const f of state.folders) {
    html += `<div class="ftab${state.activeFolder === f ? ' active' : ''}" data-folder="${f}">${f}</div>`;
  }
  bar.innerHTML = html;
  
  // Attach events
  bar.querySelectorAll('.ftab').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const folder = el.dataset.folder;
      state.activeFolder = folder === '__all__' ? null : folder;
      applyFolderFilter();
      save();
    });
  });
}

// ═══════════════════════════════════════════
// Persistence
// ═══════════════════════════════════════════

function save() {
  state.camera = {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z
  };
  try { localStorage.setItem('atem-state', JSON.stringify(state)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem('atem-state');
    if (!raw) return;
    const s = JSON.parse(raw);
    state.thoughts = s.thoughts || [];
    state.connections = s.connections || [];
    state.folders = s.folders || [];
    state.activeFolder = s.activeFolder || null;
    state.openToCapture = s.openToCapture || false;
    if (s.camera) {
      camera.position.set(s.camera.px, s.camera.py, s.camera.pz);
      controls.target.set(s.camera.tx, s.camera.ty, s.camera.tz);
    }
    // Migrate: add folder field to old thoughts
    for (const t of state.thoughts) {
      if (t.folder === undefined) t.folder = null;
    }
    // Rebuild meshes
    for (const t of state.thoughts) addThoughtMesh(t);
    rebuildConnections();
    applyFolderFilter();
    updateCaptureToggle();
    if (state.thoughts.length > 0) hideHint();
  } catch(e) { console.warn('load failed', e); }
}

// ═══════════════════════════════════════════
// Thought CRUD
// ═══════════════════════════════════════════

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const COLORS = ['#6ea8fe','#a78bfa','#f472b6','#34d399','#fbbf24','#fb923c','#f87171','#67e8f9'];
let colorIdx = 0;

function createThought(x, y, z, text, folder) {
  const t = {
    id: uid(), text: text || '',
    position: [x, y, z],
    color: COLORS[colorIdx++ % COLORS.length],
    created: Date.now(), touched: Date.now(),
    folder: folder || state.activeFolder || null
  };
  state.thoughts.push(t);
  const mesh = addThoughtMesh(t);
  applyFolderFilter();
  save();
  hideHint();
  return t;
}

function updateThought(id, text, folder) {
  const t = state.thoughts.find(t => t.id === id);
  if (!t) return;
  t.text = text;
  t.touched = Date.now();
  if (folder !== undefined) t.folder = folder;
  const mesh = getMesh(id);
  if (mesh) updateLabel(mesh, text);
  applyFolderFilter();
  save();
}

function deleteThought(id) {
  state.thoughts = state.thoughts.filter(t => t.id !== id);
  state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
  const mesh = getMesh(id);
  if (mesh) thoughtGroup.remove(mesh);
  rebuildConnections();
  save();
}

function moveThought(id, x, y, z) {
  const t = state.thoughts.find(t => t.id === id);
  if (!t) return;
  t.position = [x, y, z];
  t.touched = Date.now();
}

function addConnection(fromId, toId) {
  if (fromId === toId) return;
  state.connections.push({ id: uid(), from: fromId, to: toId, created: Date.now() });
  rebuildConnections();
  applyFolderFilter();
  save();
  toast('connected');
}

// ═══════════════════════════════════════════
// Editor (tap-to-edit)
// ═══════════════════════════════════════════

const editorEl = document.getElementById('editor');
const edText = document.getElementById('ed-text');
const edFolderRow = document.getElementById('ed-folder-row');

function renderEditorFolders() {
  let html = '';
  // "none" chip
  html += `<div class="folder-chip${!editingFolder ? ' active' : ''}" data-ef="__none__">none</div>`;
  // Existing folders
  for (const f of state.folders) {
    html += `<div class="folder-chip${editingFolder === f ? ' active' : ''}" data-ef="${f}">${f}</div>`;
  }
  // Add new
  html += `<div class="folder-chip add-new" id="add-folder-chip">+ new</div>`;
  html += `<input id="ed-folder-input" type="text" placeholder="name" maxlength="20">`;
  edFolderRow.innerHTML = html;
  
  // Events
  edFolderRow.querySelectorAll('.folder-chip[data-ef]').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      const v = el.dataset.ef;
      editingFolder = v === '__none__' ? null : v;
      renderEditorFolders();
    });
  });
  
  const addChip = document.getElementById('add-folder-chip');
  const folderInput = document.getElementById('ed-folder-input');
  if (addChip && folderInput) {
    addChip.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      folderInput.style.display = 'inline-block';
      setTimeout(() => folderInput.focus(), 50);
    });
    folderInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const name = folderInput.value.trim().toLowerCase();
        if (name && !state.folders.includes(name)) {
          state.folders.push(name);
          save();
        }
        if (name) editingFolder = name;
        folderInput.style.display = 'none';
        renderEditorFolders();
      }
      if (e.key === 'Escape') {
        folderInput.style.display = 'none';
      }
    });
    folderInput.addEventListener('blur', () => {
      const name = folderInput.value.trim().toLowerCase();
      if (name && !state.folders.includes(name)) {
        state.folders.push(name);
        save();
      }
      if (name) editingFolder = name;
      folderInput.style.display = 'none';
      renderEditorFolders();
    });
  }
}

function openEditor(id) {
  editingId = id;
  const t = state.thoughts.find(t => t.id === id);
  edText.value = t ? t.text : '';
  editingFolder = t ? (t.folder || null) : (state.activeFolder || null);
  renderEditorFolders();
  editorEl.classList.add('open');
  controls.enabled = false;
  edText.style.height = 'auto';
  setTimeout(() => { edText.focus(); edText.selectionStart = edText.value.length; }, 50);
}

function closeEditor(doSave) {
  if (doSave && editingId) {
    const text = edText.value.trim();
    if (!text) { deleteThought(editingId); }
    else { updateThought(editingId, text, editingFolder); }
  }
  editingId = null;
  editingFolder = null;
  editorEl.classList.remove('open');
  controls.enabled = true;
  renderFolderBar();
}

document.getElementById('save-btn').addEventListener('click', () => closeEditor(true));
document.getElementById('cancel-btn').addEventListener('click', () => {
  if (editingId) { const t = state.thoughts.find(t => t.id === editingId); if (t && !t.text) deleteThought(editingId); }
  closeEditor(false);
});
document.getElementById('del-btn').addEventListener('click', () => {
  if (editingId) deleteThought(editingId);
  closeEditor(false);
});

edText.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeEditor(false); e.preventDefault(); }
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) { closeEditor(true); e.preventDefault(); }
});
edText.addEventListener('input', () => { edText.style.height = 'auto'; edText.style.height = Math.min(edText.scrollHeight, 200) + 'px'; });

// ═══════════════════════════════════════════
// Zero button capture (feature 1)
// ═══════════════════════════════════════════

const zeroBtn = document.getElementById('zero-btn');
const zeroOverlay = document.getElementById('zero-overlay');
const zeroText = document.getElementById('zero-text');

function openZeroCapture() {
  zeroText.value = '';
  zeroOverlay.classList.add('open');
  controls.enabled = false;
  setTimeout(() => zeroText.focus(), 80);
}

function closeZeroCapture(doSave) {
  if (doSave) {
    const text = zeroText.value.trim();
    if (text) {
      // Place near camera center with slight random offset
      const center = controls.target.clone();
      center.x += (Math.random() - 0.5) * 3;
      center.y += (Math.random() - 0.5) * 3;
      center.z += (Math.random() - 0.5) * 1;
      createThought(center.x, center.y, center.z, text);
      toast('captured');
    }
  }
  zeroOverlay.classList.remove('open');
  controls.enabled = true;
}

// Zero button: use pointerdown to avoid canvas swallowing
zeroBtn.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  openZeroCapture();
});

document.getElementById('zero-save').addEventListener('click', () => closeZeroCapture(true));
document.getElementById('zero-cancel').addEventListener('click', () => closeZeroCapture(false));

zeroText.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeZeroCapture(false); e.preventDefault(); }
  if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) { closeZeroCapture(true); e.preventDefault(); }
});

// Auto-resize zero textarea
zeroText.addEventListener('input', () => { zeroText.style.height = 'auto'; zeroText.style.height = Math.min(zeroText.scrollHeight, 300) + 'px'; });

// ═══════════════════════════════════════════
// Raycast helpers
// ═══════════════════════════════════════════

function ndcFromEvent(e) {
  const x = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const y = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
  pointer.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
}

function hitThought(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  // Only hit visible thoughts
  const visible = thoughtGroup.children.filter(m => {
    const t = state.thoughts.find(x => x.id === m.userData.id);
    return t && isThoughtVisible(t);
  });
  const hits = raycaster.intersectObjects(visible, false);
  return hits.length ? hits[0].object : null;
}

function worldPosFromScreen(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  const camDir = camera.getWorldDirection(new THREE.Vector3());
  plane.setFromNormalAndCoplanarPoint(camDir.negate(), controls.target);
  raycaster.ray.intersectPlane(plane, intersectPt);
  return intersectPt.clone();
}

// ═══════════════════════════════════════════
// Touch / Mouse interaction
// ═══════════════════════════════════════════

function pxFromEvent(e) {
  return { x: e.clientX ?? e.touches?.[0]?.clientX ?? 0, y: e.clientY ?? e.touches?.[0]?.clientY ?? 0 };
}

function isOverlayOpen() {
  return editorEl.classList.contains('open') || zeroOverlay.classList.contains('open');
}

function onPointerDown(e) {
  if (isOverlayOpen()) return;
  if (e.target !== canvas) return;
  if (e.touches && e.touches.length > 1) { clearHold(); return; }
  
  const px = pxFromEvent(e);
  pointerStart = px;
  pointerMoved = false;
  holdTriggered = false;
  isDragging = false;
  
  const hit = hitThought(e);
  
  if (hit) {
    draggedMesh = hit;
    const wp = worldPosFromScreen(e);
    dragOffset.copy(draggedMesh.position).sub(wp);
    holdTimer = setTimeout(() => {
      if (!pointerMoved) {
        holdTriggered = true;
        connectSource = draggedMesh.userData.id;
        draggedMesh.material.emissiveIntensity = 0.6;
        pendingLineMesh.visible = true;
        if (navigator.vibrate) navigator.vibrate(30);
      }
    }, HOLD_MS);
    controls.enabled = false;
  } else {
    draggedMesh = null;
    controls.enabled = true;
  }
}

function onPointerMove(e) {
  if (isOverlayOpen()) return;
  if (e.touches && e.touches.length > 1) { clearHold(); return; }
  
  const px = pxFromEvent(e);
  const dx = px.x - pointerStart.x, dy = px.y - pointerStart.y;
  if (Math.sqrt(dx*dx + dy*dy) > DRAG_THRESH) pointerMoved = true;
  
  if (draggedMesh && !holdTriggered && pointerMoved) {
    clearTimeout(holdTimer);
    isDragging = true;
    const wp = worldPosFromScreen(e);
    draggedMesh.position.copy(wp.add(dragOffset));
    moveThought(draggedMesh.userData.id, draggedMesh.position.x, draggedMesh.position.y, draggedMesh.position.z);
    updateConnectionPositions();
  }
  
  if (holdTriggered && connectSource) {
    const srcMesh = getMesh(connectSource);
    if (srcMesh) {
      const wp = worldPosFromScreen(e);
      const pos = pendingLineMesh.geometry.attributes.position;
      pos.setXYZ(0, srcMesh.position.x, srcMesh.position.y, srcMesh.position.z);
      pos.setXYZ(1, wp.x, wp.y, wp.z);
      pos.needsUpdate = true;
    }
    const hit = hitThought(e);
    for (const child of thoughtGroup.children) {
      const t = state.thoughts.find(x => x.id === child.userData.id);
      if (t && isThoughtVisible(t)) {
        child.userData.targetEmissive = (hit === child && child.userData.id !== connectSource) ? 0.5 : 0.15;
      }
    }
  }
}

function onPointerUp(e) {
  if (isOverlayOpen()) return;
  clearTimeout(holdTimer);
  
  if (holdTriggered && connectSource) {
    pendingLineMesh.visible = false;
    const hit = hitThought(e);
    if (hit && hit.userData.id !== connectSource) addConnection(connectSource, hit.userData.id);
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    for (const child of thoughtGroup.children) child.userData.targetEmissive = 0.15;
    connectSource = null;
    applyFolderFilter();
  } else if (isDragging && draggedMesh) {
    save();
  } else if (draggedMesh && !pointerMoved) {
    openEditor(draggedMesh.userData.id);
  } else if (!draggedMesh && !pointerMoved) {
    const wp = worldPosFromScreen(e);
    const t = createThought(wp.x, wp.y, wp.z);
    openEditor(t.id);
  }
  
  draggedMesh = null;
  isDragging = false;
  holdTriggered = false;
  controls.enabled = true;
}

function clearHold() {
  clearTimeout(holdTimer);
  holdTriggered = false;
  if (connectSource) {
    const src = getMesh(connectSource);
    if (src) src.userData.targetEmissive = 0.15;
    connectSource = null;
    pendingLineMesh.visible = false;
  }
}

canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend', onPointerUp);
canvas.addEventListener('touchcancel', () => { clearHold(); draggedMesh = null; isDragging = false; controls.enabled = true; });
canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// ═══════════════════════════════════════════
// Menu (bug fix 0: pointerdown instead of click)
// ═══════════════════════════════════════════

const menuEl = document.getElementById('menu');
const menuPill = document.getElementById('menu-pill');

menuPill.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  e.preventDefault();
  menuOpen = !menuOpen;
  menuEl.classList.toggle('open', menuOpen);
});

// Close menu on outside tap
document.addEventListener('pointerdown', (e) => {
  if (menuOpen && !menuEl.contains(e.target) && e.target !== menuPill) {
    menuOpen = false;
    menuEl.classList.remove('open');
  }
});

document.getElementById('btn-reset-view').addEventListener('click', () => {
  camera.position.set(0, 0, 18);
  controls.target.set(0, 0, 0);
  menuOpen = false; menuEl.classList.remove('open');
  save();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const data = JSON.stringify({ thoughts: state.thoughts, connections: state.connections, folders: state.folders }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `atem-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  menuOpen = false; menuEl.classList.remove('open');
  toast('exported');
});

document.getElementById('btn-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (r) => {
      try {
        const data = JSON.parse(r.target.result);
        if (data.thoughts) {
          while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
          while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
          state.thoughts = data.thoughts;
          state.connections = data.connections || [];
          state.folders = data.folders || [];
          // Migrate
          for (const t of state.thoughts) { if (t.folder === undefined) t.folder = null; }
          for (const t of state.thoughts) addThoughtMesh(t);
          rebuildConnections();
          applyFolderFilter();
          save();
          toast('imported ' + state.thoughts.length + ' thoughts');
          if (state.thoughts.length > 0) hideHint();
        }
      } catch(err) { toast('import failed'); }
    };
    reader.readAsText(file);
  };
  input.click();
  menuOpen = false; menuEl.classList.remove('open');
});

// Feature 3: open to capture toggle
function updateCaptureToggle() {
  const dot = document.getElementById('capture-toggle-dot');
  if (dot) dot.classList.toggle('on', !!state.openToCapture);
}

document.getElementById('btn-open-capture').addEventListener('click', () => {
  state.openToCapture = !state.openToCapture;
  updateCaptureToggle();
  save();
  toast(state.openToCapture ? 'will open to capture' : 'will open to board');
  menuOpen = false; menuEl.classList.remove('open');
});

document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('clear all thoughts?')) return;
  state.thoughts = []; state.connections = []; state.folders = []; state.activeFolder = null;
  while (thoughtGroup.children.length) thoughtGroup.remove(thoughtGroup.children[0]);
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  renderFolderBar();
  save();
  menuOpen = false; menuEl.classList.remove('open');
  toast('cleared');
});

// ═══════════════════════════════════════════
// Toast & Hint
// ═══════════════════════════════════════════

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function hideHint() {
  if (!hintVisible) return;
  hintVisible = false;
  const h = document.getElementById('hint');
  h.style.opacity = '0';
  setTimeout(() => h.style.display = 'none', 800);
}

// ═══════════════════════════════════════════
// Stats
// ═══════════════════════════════════════════

function updateStats() {
  const el = document.getElementById('stats');
  const tc = state.thoughts.length, cc = state.connections.length;
  if (tc === 0) { el.textContent = ''; return; }
  let s = `${tc} thought${tc !== 1 ? 's' : ''}`;
  if (cc > 0) s += ` · ${cc} connection${cc !== 1 ? 's' : ''}`;
  if (state.activeFolder) s += ` · ${state.activeFolder}`;
  el.textContent = s;
}

// ═══════════════════════════════════════════
// Animation
// ═══════════════════════════════════════════

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  
  controls.update();
  
  for (const mesh of thoughtGroup.children) {
    const ud = mesh.userData;
    ud.breath += dt * 0.8;
    
    // Gentle float
    if (!isDragging || mesh !== draggedMesh) {
      mesh.position.y += Math.sin(ud.breath) * 0.0003;
      mesh.position.x += Math.cos(ud.breath * 0.7) * 0.0002;
    }
    
    // Emissive lerp
    const ce = mesh.material.emissiveIntensity;
    const te = ud.targetEmissive + Math.sin(ud.breath) * 0.03;
    mesh.material.emissiveIntensity += (te - ce) * 0.1;
    
    // Opacity lerp (for folder filtering)
    const co = mesh.material.opacity;
    const to = ud.targetOpacity;
    mesh.material.opacity += (to - co) * 0.08;
  }
  
  if (lineGroup.children.length > 0) updateConnectionPositions();
  updateStats();
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════
// Resize
// ═══════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════

load();
animate();

// Feature 3: open to capture on launch
if (state.openToCapture) {
  setTimeout(() => openZeroCapture(), 200);
}

// Auto-save periodically
setInterval(save, 10000);

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

console.log('atem — alive');
