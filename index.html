<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:'SF Pro Text',-apple-system,system-ui,sans-serif;color:#e8e4df;touch-action:none}
canvas{display:block;width:100%!important;height:100%!important;position:fixed;top:0;left:0}

/* Text input overlay */
#text-input-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(6,6,10,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;z-index:100;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .2s ease}
#text-input-overlay.active{display:flex;opacity:1}
#thought-input{background:transparent;border:none;border-bottom:1px solid rgba(232,228,223,0.15);color:#e8e4df;font-size:22px;font-family:'SF Pro Text',-apple-system,system-ui,sans-serif;font-weight:300;letter-spacing:0.3px;text-align:center;padding:16px 32px;width:80%;max-width:400px;outline:none;caret-color:#7eb8da}
#thought-input::placeholder{color:rgba(232,228,223,0.2)}
#input-hint{font-size:11px;color:rgba(232,228,223,0.18);margin-top:14px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500}

/* Delete zone */
#delete-zone{position:fixed;bottom:0;left:0;width:100%;height:90px;display:none;align-items:center;justify-content:center;z-index:50;background:linear-gradient(to top,rgba(200,60,60,0.25),transparent);transition:opacity .15s ease}
#delete-zone.active{display:flex}
#delete-zone.hot{background:linear-gradient(to top,rgba(220,50,50,0.5),transparent)}
#delete-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(220,130,130,0.6);font-weight:500;padding-bottom:env(safe-area-inset-bottom,0)}
#delete-zone.hot #delete-label{color:rgba(240,100,100,0.9)}

/* Search */
#search-bar{position:fixed;top:env(safe-area-inset-top,12px);left:50%;transform:translateX(-50%);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease}
#search-bar.active{opacity:1;pointer-events:all}
#search-input{background:rgba(30,30,40,0.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(232,228,223,0.08);border-radius:20px;color:#e8e4df;font-size:15px;font-family:'SF Pro Text',-apple-system,system-ui,sans-serif;font-weight:300;padding:10px 20px;width:260px;outline:none;caret-color:#7eb8da}
#search-input::placeholder{color:rgba(232,228,223,0.2)}

/* Pill actions */
.pill-btn{position:fixed;z-index:60;width:40px;height:40px;border-radius:50%;background:rgba(30,30,40,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(232,228,223,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.pill-btn:active{transform:scale(0.9)}
.pill-btn svg{width:18px;height:18px;stroke:rgba(232,228,223,0.4);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#btn-search{bottom:calc(28px + env(safe-area-inset-bottom,0));right:20px}
#btn-recenter{bottom:calc(28px + env(safe-area-inset-bottom,0));left:20px}

/* Connection preview line */
#connect-line{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* Subtle pulse for thoughts */
@keyframes breathe{0%,100%{opacity:0.85}50%{opacity:1}}
</style>
</head>
<body>

<div id="text-input-overlay">
  <input type="text" id="thought-input" placeholder="what are you thinking?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div id="input-hint">return to save · esc to cancel</div>
</div>

<div id="delete-zone"><div id="delete-label">release to delete</div></div>

<div id="search-bar">
  <input type="text" id="search-input" placeholder="find a thought..." autocomplete="off">
</div>

<button class="pill-btn" id="btn-search">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
</button>
<button class="pill-btn" id="btn-recenter">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>

<svg id="connect-line"><line id="drag-line" stroke="rgba(126,184,218,0.4)" stroke-width="1.5" stroke-dasharray="6,4" x1="0" y1="0" x2="0" y2="0" style="display:none"/></svg>

<script type="importmap">
{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ─── STATE ──────────────────────────────────────────────────────────
const S = {
  thoughts: [],    // {id, text, x, y, z, color, vx, vy, vz}
  connections: [], // {id, from, to}
  nextId: 1
};

function uid(){ return S.nextId++; }
function save(){
  localStorage.setItem('atem_state', JSON.stringify(S));
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem('atem_state'));
    if(d){
      S.thoughts = d.thoughts || [];
      S.connections = d.connections || [];
      S.nextId = d.nextId || 1;
    }
  } catch(e){}
}

// ─── THREE.JS SETUP ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.0025);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 0, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

// Lights
const amb = new THREE.AmbientLight(0x404050, 0.6);
scene.add(amb);
const dir = new THREE.DirectionalLight(0xeeeeff, 0.8);
dir.position.set(40, 60, 50);
scene.add(dir);
const pt = new THREE.PointLight(0x7eb8da, 0.4, 300);
pt.position.set(0, 0, 60);
scene.add(pt);

// ─── MATERIALS & GEOMETRIES ────────────────────────────────────────
const PALETTE = [
  0x7eb8da, 0xb8a9c9, 0xd4a574, 0x8fc1a9, 0xdaa5a5,
  0xa5c0d4, 0xc9b896, 0x96b8c9, 0xc4a1b2, 0xa8c4a0
];
function pickColor(){ return PALETTE[Math.floor(Math.random()*PALETTE.length)]; }

const sphereGeo = new THREE.SphereGeometry(1, 24, 24);
const lineMat = new THREE.LineBasicMaterial({ color: 0x7eb8da, transparent: true, opacity: 0.2 });

function makeNodeMaterial(color){
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.55,
    metalness: 0.15,
    transparent: true,
    opacity: 0.92
  });
}

// ─── SPRITE TEXT ────────────────────────────────────────────────────
function makeTextSprite(text, scale=1){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontSize = 42;
  ctx.font = `300 ${fontSize}px -apple-system, system-ui, sans-serif`;
  const metrics = ctx.measureText(text);
  const w = Math.min(metrics.width + 40, 512);
  canvas.width = w;
  canvas.height = fontSize + 24;
  ctx.font = `300 ${fontSize}px -apple-system, system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(232,228,223,0.88)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w/2, canvas.height/2, w-20);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, sizeAttenuation: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set((w/canvas.height)*3*scale, 3*scale, 1);
  return sprite;
}

// ─── SCENE OBJECTS ─────────────────────────────────────────────────
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);
const lineGroup = new THREE.Group();
scene.add(lineGroup);

const meshMap = new Map();    // id -> {mesh, sprite, data}
const lineMap = new Map();    // conn.id -> line

function baseRadius(thought){
  const conns = S.connections.filter(c => c.from === thought.id || c.to === thought.id).length;
  return 1.2 + conns * 0.15;
}

function addThoughtToScene(t){
  const col = t.color || 0x7eb8da;
  const mat = makeNodeMaterial(col);
  const mesh = new THREE.Mesh(sphereGeo, mat);
  const r = baseRadius(t);
  mesh.scale.set(r, r, r);
  mesh.position.set(t.x, t.y, t.z);
  mesh.userData = { id: t.id };
  nodeGroup.add(mesh);

  const sprite = makeTextSprite(t.text || '');
  sprite.position.set(t.x, t.y + r + 2.2, t.z);
  nodeGroup.add(sprite);

  meshMap.set(t.id, { mesh, sprite, data: t });
}

function addConnectionToScene(c){
  const a = meshMap.get(c.from);
  const b = meshMap.get(c.to);
  if(!a || !b) return;
  const pts = [a.mesh.position.clone(), b.mesh.position.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x7eb8da, transparent: true, opacity: 0.18 });
  const line = new THREE.Line(geo, mat);
  line.userData = { connId: c.id };
  lineGroup.add(line);
  lineMap.set(c.id, line);
}

function rebuildScene(){
  while(nodeGroup.children.length) nodeGroup.remove(nodeGroup.children[0]);
  while(lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  meshMap.clear();
  lineMap.clear();
  S.thoughts.forEach(t => addThoughtToScene(t));
  S.connections.forEach(c => addConnectionToScene(c));
}

function updateNodeSizes(){
  S.thoughts.forEach(t => {
    const entry = meshMap.get(t.id);
    if(!entry) return;
    const r = baseRadius(t);
    entry.mesh.scale.set(r, r, r);
  });
}

function updateLines(){
  S.connections.forEach(c => {
    const line = lineMap.get(c.id);
    if(!line) return;
    const a = meshMap.get(c.from);
    const b = meshMap.get(c.to);
    if(!a || !b) return;
    const pos = line.geometry.attributes.position;
    pos.setXYZ(0, a.mesh.position.x, a.mesh.position.y, a.mesh.position.z);
    pos.setXYZ(1, b.mesh.position.x, b.mesh.position.y, b.mesh.position.z);
    pos.needsUpdate = true;
  });
}

function updateSpritePositions(){
  meshMap.forEach(entry => {
    const r = baseRadius(entry.data);
    entry.sprite.position.set(
      entry.mesh.position.x,
      entry.mesh.position.y + r + 2.2,
      entry.mesh.position.z
    );
  });
}

// ─── ORBIT CONTROLS (minimal custom) ──────────────────────────────
const orbit = {
  target: new THREE.Vector3(0,0,0),
  spherical: new THREE.Spherical(80, Math.PI/2, 0),
  dampedSpherical: new THREE.Spherical(80, Math.PI/2, 0),
  damping: 0.08,
  rotating: false,
  pinching: false,
  panning: false,
  lastTouch: null,
  lastPinchDist: 0,
  lastPanPos: null,
  inertiaTheta: 0,
  inertiaPhi: 0,

  update(){
    this.dampedSpherical.radius += (this.spherical.radius - this.dampedSpherical.radius) * this.damping;
    this.dampedSpherical.theta += (this.spherical.theta - this.dampedSpherical.theta) * this.damping;
    this.dampedSpherical.phi += (this.spherical.phi - this.dampedSpherical.phi) * this.damping;
    this.dampedSpherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, this.dampedSpherical.phi));
    this.dampedSpherical.radius = Math.max(10, Math.min(400, this.dampedSpherical.radius));

    if(!this.rotating){
      this.spherical.theta += this.inertiaTheta;
      this.spherical.phi += this.inertiaPhi;
      this.inertiaTheta *= 0.95;
      this.inertiaPhi *= 0.95;
    }

    const p = new THREE.Vector3().setFromSpherical(this.dampedSpherical);
    camera.position.copy(this.target).add(p);
    camera.lookAt(this.target);
  }
};

// ─── RAYCASTING ────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.params.Points = { threshold: 2 };
const pointer = new THREE.Vector2();

function raycast(x, y){
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = [];
  meshMap.forEach(e => meshes.push(e.mesh));
  const hits = raycaster.intersectObjects(meshes);
  return hits.length > 0 ? hits[0] : null;
}

function screenPos(worldPos){
  const v = worldPos.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * innerWidth,
    y: (-v.y * 0.5 + 0.5) * innerHeight
  };
}

function tapWorldPos(x, y, dist){
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  return raycaster.ray.at(dist || orbit.dampedSpherical.radius * 0.5, new THREE.Vector3());
}

// ─── INTERACTION STATE ─────────────────────────────────────────────
let interactionState = 'idle'; // idle | dragging | connecting | orbiting | pinching | panning
let activeNode = null;
let connectSourceId = null;
let longPressTimer = null;
let touchStartTime = 0;
let touchStartPos = { x:0, y:0 };
let hasMoved = false;
const LONG_PRESS_MS = 400;
const TAP_THRESHOLD = 12;
const DRAG_PLANE = new THREE.Plane();
const dragOffset = new THREE.Vector3();
const intersection = new THREE.Vector3();

const deleteZone = document.getElementById('delete-zone');
const textOverlay = document.getElementById('text-input-overlay');
const thoughtInput = document.getElementById('thought-input');
const searchBar = document.getElementById('search-bar');
const searchInput = document.getElementById('search-input');
const dragLine = document.getElementById('drag-line');

// ─── THOUGHT CRUD ──────────────────────────────────────────────────
function createThought(x, y, z, text=''){
  const t = { id: uid(), text, x, y, z, color: pickColor(), vx: (Math.random()-0.5)*0.02, vy: (Math.random()-0.5)*0.02, vz: (Math.random()-0.5)*0.02 };
  S.thoughts.push(t);
  addThoughtToScene(t);
  save();
  return t;
}

function editThought(id, newText){
  const t = S.thoughts.find(t => t.id === id);
  if(!t) return;
  t.text = newText;
  const entry = meshMap.get(id);
  if(entry){
    nodeGroup.remove(entry.sprite);
    const sprite = makeTextSprite(newText);
    const r = baseRadius(t);
    sprite.position.set(entry.mesh.position.x, entry.mesh.position.y + r + 2.2, entry.mesh.position.z);
    nodeGroup.add(sprite);
    entry.sprite = sprite;
  }
  save();
}

function deleteThought(id){
  S.thoughts = S.thoughts.filter(t => t.id !== id);
  const connsToRemove = S.connections.filter(c => c.from === id || c.to === id);
  connsToRemove.forEach(c => {
    const line = lineMap.get(c.id);
    if(line) lineGroup.remove(line);
    lineMap.delete(c.id);
  });
  S.connections = S.connections.filter(c => c.from !== id && c.to !== id);
  const entry = meshMap.get(id);
  if(entry){
    nodeGroup.remove(entry.mesh);
    nodeGroup.remove(entry.sprite);
    meshMap.delete(id);
  }
  updateNodeSizes();
  save();
}

function createConnection(fromId, toId){
  if(fromId === toId) return;
  if(S.connections.find(c => (c.from===fromId && c.to===toId) || (c.from===toId && c.to===fromId))) return;
  const c = { id: uid(), from: fromId, to: toId };
  S.connections.push(c);
  addConnectionToScene(c);
  updateNodeSizes();
  save();
}

function deleteConnection(id){
  const line = lineMap.get(id);
  if(line) lineGroup.remove(line);
  lineMap.delete(id);
  S.connections = S.connections.filter(c => c.id !== id);
  updateNodeSizes();
  save();
}

// ─── TEXT INPUT ─────────────────────────────────────────────────────
let pendingThoughtAction = null; // {type:'new', x,y,z} or {type:'edit', id}

function openInput(action){
  pendingThoughtAction = action;
  textOverlay.classList.add('active');
  if(action.type === 'edit'){
    const t = S.thoughts.find(t => t.id === action.id);
    thoughtInput.value = t ? t.text : '';
  } else {
    thoughtInput.value = '';
  }
  setTimeout(() => thoughtInput.focus(), 50);
}

function closeInput(){
  textOverlay.classList.remove('active');
  thoughtInput.blur();
  pendingThoughtAction = null;
}

function submitInput(){
  const text = thoughtInput.value.trim();
  if(!text){ closeInput(); return; }
  if(pendingThoughtAction.type === 'new'){
    createThought(pendingThoughtAction.x, pendingThoughtAction.y, pendingThoughtAction.z, text);
  } else if(pendingThoughtAction.type === 'edit'){
    editThought(pendingThoughtAction.id, text);
  }
  closeInput();
}

thoughtInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); submitInput(); }
  if(e.key === 'Escape'){ closeInput(); }
});
textOverlay.addEventListener('click', e => { if(e.target === textOverlay) closeInput(); });

// ─── SEARCH ─────────────────────────────────────────────────────────
let searchActive = false;
document.getElementById('btn-search').addEventListener('click', () => {
  searchActive = !searchActive;
  searchBar.classList.toggle('active', searchActive);
  if(searchActive){ searchInput.value = ''; setTimeout(() => searchInput.focus(), 50); }
  else { searchInput.blur(); clearHighlights(); }
});

function clearHighlights(){
  meshMap.forEach(entry => {
    entry.mesh.material.emissive = new THREE.Color(0x000000);
    entry.mesh.material.emissiveIntensity = 0;
  });
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  clearHighlights();
  if(!q) return;
  S.thoughts.forEach(t => {
    if(t.text.toLowerCase().includes(q)){
      const entry = meshMap.get(t.id);
      if(entry){
        entry.mesh.material.emissive = new THREE.Color(0x7eb8da);
        entry.mesh.material.emissiveIntensity = 0.8;
      }
    }
  });
});

searchInput.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    searchActive = false;
    searchBar.classList.remove('active');
    searchInput.blur();
    clearHighlights();
  }
  if(e.key === 'Enter'){
    const q = searchInput.value.toLowerCase().trim();
    if(!q) return;
    const found = S.thoughts.find(t => t.text.toLowerCase().includes(q));
    if(found){
      const entry = meshMap.get(found.id);
      if(entry){
        orbit.target.copy(entry.mesh.position);
        orbit.spherical.radius = 40;
      }
    }
  }
});

// ─── RECENTER ───────────────────────────────────────────────────────
document.getElementById('btn-recenter').addEventListener('click', () => {
  if(S.thoughts.length === 0){
    orbit.target.set(0,0,0);
    orbit.spherical.radius = 80;
    return;
  }
  const center = new THREE.Vector3();
  S.thoughts.forEach(t => center.add(new THREE.Vector3(t.x, t.y, t.z)));
  center.divideScalar(S.thoughts.length);
  orbit.target.copy(center);
  orbit.spherical.radius = 80;
});

// ─── TOUCH HANDLING ─────────────────────────────────────────────────
function getTouchXY(e){ return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
function dist2D(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

function pinchDist(e){ return Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
function pinchCenter(e){ return { x: (e.touches[0].clientX + e.touches[1].clientX)/2, y: (e.touches[0].clientY + e.touches[1].clientY)/2 }; }

const canvas = renderer.domElement;

canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });
canvas.addEventListener('touchcancel', onPointerUp, { passive: false });

// Mouse fallback
canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('wheel', e => {
  orbit.spherical.radius += e.deltaY * 0.05;
  e.preventDefault();
}, { passive: false });

function onPointerDown(e){
  e.preventDefault();
  if(textOverlay.classList.contains('active') || searchActive) return;

  const isTouch = !!e.touches;

  // Two-finger: pinch/pan
  if(isTouch && e.touches.length === 2){
    interactionState = 'pinching';
    orbit.lastPinchDist = pinchDist(e);
    orbit.lastPanPos = pinchCenter(e);
    clearLongPress();
    return;
  }

  const pos = getTouchXY(e);
  touchStartPos = { x: pos.x, y: pos.y };
  touchStartTime = Date.now();
  hasMoved = false;

  const hit = raycast(pos.x, pos.y);

  if(hit){
    activeNode = hit.object.userData.id;
    // Start long-press timer for connecting
    longPressTimer = setTimeout(() => {
      if(!hasMoved){
        interactionState = 'connecting';
        connectSourceId = activeNode;
        // Haptic feedback if available
        if(navigator.vibrate) navigator.vibrate(30);
      }
    }, LONG_PRESS_MS);
  } else {
    activeNode = null;
    interactionState = 'orbiting';
    orbit.rotating = true;
    orbit.lastTouch = { x: pos.x, y: pos.y };
    orbit.inertiaTheta = 0;
    orbit.inertiaPhi = 0;
  }
}

function onPointerMove(e){
  e.preventDefault();
  const isTouch = !!e.touches;

  // Pinch zoom + pan
  if(interactionState === 'pinching' && isTouch && e.touches.length === 2){
    const d = pinchDist(e);
    const ratio = orbit.lastPinchDist / d;
    orbit.spherical.radius *= ratio;
    orbit.lastPinchDist = d;

    const center = pinchCenter(e);
    if(orbit.lastPanPos){
      const dx = center.x - orbit.lastPanPos.x;
      const dy = center.y - orbit.lastPanPos.y;
      const panScale = orbit.dampedSpherical.radius * 0.002;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      orbit.target.addScaledVector(right, -dx * panScale);
      orbit.target.addScaledVector(up, dy * panScale);
    }
    orbit.lastPanPos = center;
    return;
  }

  const pos = isTouch && e.touches.length > 0 ? getTouchXY(e) : (e.touches ? null : { x: e.clientX, y: e.clientY });
  if(!pos) return;

  const moved = dist2D(pos, touchStartPos);
  if(moved > TAP_THRESHOLD) hasMoved = true;

  // Dragging a node
  if(activeNode !== null && interactionState !== 'connecting' && interactionState !== 'orbiting' && hasMoved){
    clearLongPress();
    interactionState = 'dragging';
    deleteZone.classList.add('active');

    const entry = meshMap.get(activeNode);
    if(entry){
      // Project drag onto a camera-facing plane through the node
      DRAG_PLANE.setFromNormalAndCoplanarPoint(
        camera.getWorldDirection(new THREE.Vector3()).negate(),
        entry.mesh.position
      );
      pointer.x = (pos.x / innerWidth) * 2 - 1;
      pointer.y = -(pos.y / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      if(raycaster.ray.intersectPlane(DRAG_PLANE, intersection)){
        entry.mesh.position.copy(intersection);
        entry.data.x = intersection.x;
        entry.data.y = intersection.y;
        entry.data.z = intersection.z;
        // Kill drift while dragging
        entry.data.vx = 0;
        entry.data.vy = 0;
        entry.data.vz = 0;
      }
    }

    // Check delete zone
    const inDeleteZone = pos.y > innerHeight - 100;
    deleteZone.classList.toggle('hot', inDeleteZone);
  }

  // Connecting
  if(interactionState === 'connecting'){
    const sourceEntry = meshMap.get(connectSourceId);
    if(sourceEntry){
      const sp = screenPos(sourceEntry.mesh.position);
      dragLine.style.display = 'block';
      dragLine.setAttribute('x1', sp.x);
      dragLine.setAttribute('y1', sp.y);
      dragLine.setAttribute('x2', pos.x);
      dragLine.setAttribute('y2', pos.y);
    }
  }

  // Orbiting
  if(interactionState === 'orbiting' && orbit.lastTouch){
    const dx = pos.x - orbit.lastTouch.x;
    const dy = pos.y - orbit.lastTouch.y;
    const speed = 0.004;
    orbit.spherical.theta -= dx * speed;
    orbit.spherical.phi -= dy * speed;
    orbit.inertiaTheta = -dx * speed * 0.3;
    orbit.inertiaPhi = -dy * speed * 0.3;
    orbit.lastTouch = { x: pos.x, y: pos.y };
  }
}

function onPointerUp(e){
  e.preventDefault();
  clearLongPress();
  const isTouch = !!e.changedTouches;
  const pos = isTouch ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : { x: e.clientX, y: e.clientY };

  // Finish connecting
  if(interactionState === 'connecting'){
    dragLine.style.display = 'none';
    const hit = raycast(pos.x, pos.y);
    if(hit && hit.object.userData.id !== connectSourceId){
      createConnection(connectSourceId, hit.object.userData.id);
      if(navigator.vibrate) navigator.vibrate(15);
    }
    connectSourceId = null;
    interactionState = 'idle';
    activeNode = null;
    return;
  }

  // Finish dragging
  if(interactionState === 'dragging'){
    const inDeleteZone = pos.y > innerHeight - 100;
    if(inDeleteZone && activeNode !== null){
      deleteThought(activeNode);
      if(navigator.vibrate) navigator.vibrate([20, 50, 20]);
    } else {
      save();
    }
    deleteZone.classList.remove('active', 'hot');
    interactionState = 'idle';
    activeNode = null;
    return;
  }

  // Handle pinch end
  if(interactionState === 'pinching'){
    if(isTouch && e.touches && e.touches.length < 2){
      interactionState = 'idle';
    }
    return;
  }

  orbit.rotating = false;

  // Tap on node = edit
  if(!hasMoved && activeNode !== null){
    const tapDuration = Date.now() - touchStartTime;
    if(tapDuration < LONG_PRESS_MS){
      openInput({ type: 'edit', id: activeNode });
    }
    activeNode = null;
    interactionState = 'idle';
    return;
  }

  // Tap on empty space = new thought
  if(!hasMoved && activeNode === null){
    const tapDuration = Date.now() - touchStartTime;
    if(tapDuration < 300){
      const worldPos = tapWorldPos(pos.x, pos.y);
      openInput({ type: 'new', x: worldPos.x, y: worldPos.y, z: worldPos.z });
    }
  }

  interactionState = 'idle';
  activeNode = null;
}

function clearLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } }

// ─── SUBTLE DRIFT PHYSICS ──────────────────────────────────────────
const DRIFT_SPEED = 0.003;
const DRIFT_DAMPING = 0.998;

function applyDrift(dt){
  if(interactionState === 'dragging') return;
  S.thoughts.forEach(t => {
    if(interactionState === 'dragging' && activeNode === t.id) return;
    // Gentle random force
    t.vx += (Math.random()-0.5) * DRIFT_SPEED;
    t.vy += (Math.random()-0.5) * DRIFT_SPEED;
    t.vz += (Math.random()-0.5) * DRIFT_SPEED;
    // Damping
    t.vx *= DRIFT_DAMPING;
    t.vy *= DRIFT_DAMPING;
    t.vz *= DRIFT_DAMPING;
    // Clamp speed
    const speed = Math.sqrt(t.vx*t.vx + t.vy*t.vy + t.vz*t.vz);
    if(speed > 0.08){
      const s = 0.08/speed;
      t.vx *= s; t.vy *= s; t.vz *= s;
    }
    t.x += t.vx;
    t.y += t.vy;
    t.z += t.vz;
    const entry = meshMap.get(t.id);
    if(entry){
      entry.mesh.position.set(t.x, t.y, t.z);
    }
  });
}

// ─── GENTLE BREATHING ANIMATION FOR NODES ──────────────────────────
function breathe(time){
  meshMap.forEach((entry, id) => {
    const r = baseRadius(entry.data);
    const pulse = 1 + Math.sin(time * 0.001 + id * 1.7) * 0.03;
    const s = r * pulse;
    entry.mesh.scale.set(s, s, s);
  });
}

// ─── RENDER LOOP ────────────────────────────────────────────────────
let lastTime = 0;
function animate(time){
  requestAnimationFrame(animate);
  const dt = Math.min(time - lastTime, 33);
  lastTime = time;

  applyDrift(dt);
  breathe(time);
  updateSpritePositions();
  updateLines();
  orbit.update();
  pt.position.copy(camera.position);

  renderer.render(scene, camera);
}

// ─── RESIZE ─────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── INIT ───────────────────────────────────────────────────────────
load();
rebuildScene();
animate(0);

// Auto-save periodically (drift changes positions)
setInterval(save, 5000);

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
